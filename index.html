<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>loglog.wtf</title>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        font-family: sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .equation {
        --bg-size: 400%;
        --color-one: hsl(3, 90%, 55%);
        --color-two: hsl(35, 95%, 55%);
        font-family: sans-serif;
        font-size: clamp(3rem, 25vmin, 8rem);
        background: linear-gradient(
            90deg,
            var(--color-one),
            var(--color-two),
            var(--color-one)
          )
          0 0 / var(--bg-size) 100%;
        color: transparent;
        background-clip: text;
      }

      @media (prefers-reduced-motion: no-preference) {
        .equation {
          animation: move-bg 11s linear infinite;
        }
        @keyframes move-bg {
          to {
            background-position: var(--bg-size) 0;
          }
        }
      }

      .footnote {
        position: absolute;
        bottom: 1rem;
        width: 100%;
        text-align: center;
        font-size: 1.2rem;
        color: #444;
        font-style: italic;
      }

      .footnote a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px dotted #888;
        transition: color 0.3s ease, border-color 0.3s ease;
      }

      .footnote a:hover {
        border-color: #222;
        background-color: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <div class="equation">$$\log(\log(n)) < 4$$</div>
    <div class="footnote">
      i promise bro trust <a href="https://nates.place">me</a>
    </div>
  </body>
</html>
